<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>%sveltekit.status% — Floply</title>
    <style>
      /* Standalone: this page renders when the app itself could not, so it cannot depend
         on the bundled stylesheet. Tokens are inlined to match app.css. */
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0a0a0f;
        color: #e2e8f0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      }
      main {
        max-width: 32rem;
        padding: 2rem;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 2.5rem;
        letter-spacing: -0.03em;
        background: linear-gradient(135deg, #6366f1, #a78bfa);
        background-clip: text;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      p {
        margin: 0 0 1.5rem;
        color: #94a3b8;
        line-height: 1.6;
      }
      a {
        color: #a78bfa;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>%sveltekit.status%</h1>
      <p>%sveltekit.error.message%</p>
      <p><a href="/">Back to the estimator</a></p>
    </main>
  </body>
</html>
