name: image

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*.*.*"]

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: floply:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Rendering / runs the layout's server load, which imports the runtime
      # dependencies; a missing one only shows up as a 500 here, not at build time.
      - name: Smoke test
        run: |
          docker run -d --name floply -p 3000:3000 -e FLOPLY_PRICING_FIXTURE=1 floply:ci
          curl -fsS --retry 30 --retry-delay 1 --retry-all-errors http://localhost:3000/api/health
          curl -fsS -o /dev/null http://localhost:3000/

      - if: failure()
        run: docker logs floply

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Image tags drop the leading "v": git tag v1.2.3 publishes 1.2.3 and 1.2.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
