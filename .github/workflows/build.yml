name: build

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: floply:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Rendering / runs the layout's server load, which imports the runtime
      # dependencies; a missing one only shows up as a 500 here, not at build time.
      - name: Smoke test
        run: |
          docker run -d --name floply -p 3000:3000 -e FLOPLY_PRICING_FIXTURE=1 floply:ci
          curl -fsS --retry 30 --retry-delay 1 --retry-all-errors http://localhost:3000/api/health
          curl -fsS -o /dev/null http://localhost:3000/

      - if: failure()
        run: docker logs floply
