<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Abacus, matching the mark adopted in 8be1765: a reckoning tool for a cost estimator. -->
  <rect width="32" height="32" rx="6" fill="#0b0f1a" />
  <g stroke="#35415c" stroke-width="1.5" stroke-linecap="round">
    <line x1="8" y1="9" x2="24" y2="9" />
    <line x1="8" y1="16" x2="24" y2="16" />
    <line x1="8" y1="23" x2="24" y2="23" />
  </g>
  <g fill="#5b8dee">
    <circle cx="11" cy="9" r="2.6" />
    <circle cx="18" cy="9" r="2.6" />
    <circle cx="13" cy="16" r="2.6" />
    <circle cx="21" cy="16" r="2.6" />
    <circle cx="10" cy="23" r="2.6" />
  </g>
  <circle cx="21" cy="23" r="2.6" fill="#54a24b" />
</svg>
